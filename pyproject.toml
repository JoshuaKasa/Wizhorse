[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wizhorse"
version = "0.1.0"
description = "A friendly assistant for understanding Windows file warnings"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "JoshuaKasa"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["windows-security", "false-positive", "file-analysis", "mcp", "suspicious-files"]
dependencies = [
    "Jinja2",
    # The MCP server uses the FastMCP API provided by MCP 1.x.
    "mcp<2",
    "pydantic>=2",
    "pefile",
    "yara-python",
]

[project.urls]
Homepage = "https://github.com/JoshuaKasa/Wizhorse"
Repository = "https://github.com/JoshuaKasa/Wizhorse"
Issues = "https://github.com/JoshuaKasa/Wizhorse/issues"

[tool.setuptools.packages.find]
include = ["wizhorse*"]

[tool.setuptools.package-data]
"wizhorse.workers.ghidra_scripts" = ["*.java", "*.py"]
"wizhorse.workers" = ["yara_rules/*.yar", "yara_rules/*.yara"]
"wizhorse.reports" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
